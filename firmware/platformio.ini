; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
; ESP32 보드(arduino_nano_esp32) 고장으로 Seeed XIAO nRF52840으로 교체(2026-07-29).
; XIAO nRF52840엔 WiFi가 없어 NetworkTransport가 BLE(Nordic UART Service, Adafruit
; Bluefruit 코어의 BLEUart)로 바뀜.
; board=xiaoble(공식 platform-nordicnrf52 레지스트리)는 실제로 존재하지 않는 ID였음
; (실제로 `pio boards`에 없어 UnknownBoard 에러로 확인) — Seeed가 직접 유지하는
; platform-seeedboards로 교체. Sense가 아닌 plain 변형(IMU/마이크 없음)이 대상.
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@^7

; 최종 배선 확정: Peltier 2채널(D9/D10, D7/D8) 전부 DRV8871(8핀, sleep 핀 없음).
; DRV8833은 채널당 sleep 핀이 하나씩 더 필요한데 D0~D10을 이미 ERM 2채널+Peltier 2채널로
; 다 써서 자리가 없어 미지원(Config.h 참고) — 이 프로젝트에선 drv8871 환경만 사용.
[env:drv8871]
build_flags = ${env.build_flags} -D PELTIER_DRIVER_DRV8871
build_src_filter = +<*> -<manual_tests/>

; ULT 핀 극성 실측용 독립 테스트 (src/manual_tests/ult_polarity_test.cpp만 빌드).
; 메인 펌웨어와 무관 — 멀티미터로 극성 확인 후 지울 필요 없이 그냥 두면 됨.
[env:ult_test_erm]
build_flags = ${env.build_flags}
build_src_filter = -<*> +<manual_tests/ult_polarity_test.cpp>

[env:ult_test_peltier]
build_flags = ${env.build_flags} -D TEST_TARGET_PELTIER
build_src_filter = -<*> +<manual_tests/ult_polarity_test.cpp>

; D2에서 소프트웨어 PWM 신호가 실제로 나오는지만 확인하는 독립 테스트. 드라이버 보드 불필요.
; SoftPwm.cpp에 의존하므로 그 파일도 같이 포함시켜야 함.
[env:pwm_test]
build_flags = ${env.build_flags}
build_src_filter = -<*> +<manual_tests/pwm_signal_test.cpp> +<SoftPwm.cpp>

; 메인 펌웨어의 실제 ErmDriver를 그대로 써서 duty 0->255->0을 반복 램프하는 테스트.
; PELTIER_DRIVER_* 플래그는 Config.h의 #error 방지용으로만 필요(ERM 동작엔 영향 없음,
; DRV8871만 지원하므로 이 값 고정).
[env:erm_ramp_test]
build_flags = ${env.build_flags} -D PELTIER_DRIVER_DRV8871
build_src_filter = -<*> +<manual_tests/erm_ramp_test.cpp> +<ErmDriver.cpp> +<SoftPwm.cpp>

; 메인 펌웨어의 실제 PeltierDriver(DRV8871)를 그대로 써서 duty 0->255->0을 반복 램프하는 테스트.
[env:peltier_ramp_test]
build_flags = ${env.build_flags} -D PELTIER_DRIVER_DRV8871
build_src_filter = -<*> +<manual_tests/peltier_ramp_test.cpp> +<PeltierDriver.cpp> +<SoftPwm.cpp>

; 전류 측정용 — duty를 램프 없이 고정하고 시리얼로 값을 조정할 수 있는 테스트.
[env:peltier_fixed_test]
build_flags = ${env.build_flags} -D PELTIER_DRIVER_DRV8871
build_src_filter = -<*> +<manual_tests/peltier_fixed_test.cpp> +<PeltierDriver.cpp> +<SoftPwm.cpp>

; Peltier(D9/D10)와 ERM(D5/D6)을 동시에 램프해서 두 채널이 한 번에 문제없이 도는지 확인.
[env:erm_peltier_combo_test]
build_flags = ${env.build_flags} -D PELTIER_DRIVER_DRV8871
build_src_filter = -<*> +<manual_tests/erm_peltier_combo_test.cpp> +<ErmDriver.cpp> +<PeltierDriver.cpp> +<SoftPwm.cpp>

; Peltier 1번=가열/2번=냉각 고정 구동 — 모듈별 독립 방향 제어가 실제로 되는지 확인.
[env:peltier_independent_test]
build_flags = ${env.build_flags} -D PELTIER_DRIVER_DRV8871
build_src_filter = -<*> +<manual_tests/peltier_independent_test.cpp> +<PeltierDriver.cpp> +<SoftPwm.cpp>

; BLE 광고/연결만 단독으로 확인하는 최소 단위 테스트(구 wifi_connect_test의 BLE판).
; PELTIER_DRIVER_* 플래그는 Config.h의 #error 방지용으로만 필요(BLE 테스트엔 영향 없음,
; DRV8871만 지원하므로 이 값 고정).
[env:ble_uart_test]
build_flags = ${env.build_flags} -D PELTIER_DRIVER_DRV8871
build_src_filter = -<*> +<manual_tests/ble_uart_test.cpp>
